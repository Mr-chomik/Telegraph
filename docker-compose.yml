services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: telegraph
      POSTGRES_PASSWORD: telegraph
      POSTGRES_DB: telegraph
    ports:
      - "5432:5432"
    volumes:
      - telegraph-db-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telegraph -d telegraph"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      # Inside the compose network the database host is the `db` service.
      DATABASE_URL: postgresql://telegraph:telegraph@db:5432/telegraph
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/login"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    volumes:
      - telegraph-data:/app/data

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://telegraph:telegraph@db:5432/telegraph
    volumes:
      - telegraph-data:/app/data

  # Optional local LLM. Start with: docker compose --profile ai up -d
  ai:
    image: ollama/ollama:latest
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      - "11434:11434"

volumes:
  telegraph-db-pgdata:
  telegraph-data:
  ollama: